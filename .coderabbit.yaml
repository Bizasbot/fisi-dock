# CodeRabbit configuration for Fisi Dock.
# Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US
tone_instructions: "Be direct and concise. Point out real defects first, then maintainability. Skip praise and trivial style nits."

reviews:
  profile: chill
  high_level_summary: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    # Besides main, review the full-project review branch.
    base_branches:
      - "^full-review-base$"
  path_filters:
    - "!package-lock.json"
    - "!docs/images/**"
    - "!docs/screenshot.png"
    - "!node_modules/**"
    - "!tmp/**"
  path_instructions:
    - path: "{extensions,lib}/**/*.ts"
      instructions: |
        Fisi Dock is a Pi package (extension and themes) that repaints Gentle Shell's UI.
        It must never modify a Gentle Shell file, and `/fisi-dock off` must hand everything back.
        Focus on: terminal rendering correctness (ANSI, Unicode width, braille glyphs, narrow
        widths such as a phone over SSH), render-loop performance, cleanup of timers and listeners,
        and cross-platform behavior on Windows, macOS and Linux with Node 22 and 24.
    - path: "tests/**/*.ts"
      instructions: |
        Tests run with `node --test`. Check that each test asserts observable behavior through the
        public interface, covers the edge cases its rule names, and does not depend on the host
        machine (paths, git config, terminal size, time zone).
    - path: "themes/*.json"
      instructions: |
        Themes are generated by `scripts/build-themes.mjs`. Flag colors that break contrast or
        drift between variants, and any theme that looks edited by hand instead of regenerated.
    - path: "scripts/**"
      instructions: "Development scripts. Check portability across Windows, macOS and Linux shells."
    - path: "**/*.md"
      instructions: "Check that docs match the actual commands, settings and behavior in the code."

chat:
  auto_reply: true
